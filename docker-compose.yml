services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: astro-agent:latest
    container_name: astro-agent
    restart: unless-stopped
    ports:
      - "4219:4219"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
    volumes:
      - chroma_data:/app/data/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4219/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chroma_data:
